name: 01 - CWVJ Flask CI Workflow

on:
  push:

jobs:
  flask-ci-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Build Docker Image
        run: docker build -t cwhk-flask-app:v1.0.0 .

      - name: Run Container
        run: docker run -d -p 5000:5000 --name cwhk-flask-container cwhk-flask-app:v1.0.0

      - name: Smoke Test
        run: |
          sleep 5
          curl http://localhost:5000/health