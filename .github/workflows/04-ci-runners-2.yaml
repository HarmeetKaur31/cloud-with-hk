name: "04- Understanding Runners (Win + Ubuntu)"
on: push
jobs:
  ubuntu-runner-job:
    runs-on: ubuntu-latest
    steps:
      - name: Print Ubuntu Runner Details
        run: |
          echo "Workflow is executing on Github-hosted runner."
          echo "Runner Name: $RUNNER_NAME"
          echo "Runner OS: $RUNNER_OS"
          echo "Runner Architecture: $RUNNER_ARCH"
  windows-runner-job:
    runs-on: windows-latest
    steps:
      - name: Print Windows Runner Details
        shell: bash
        run: |
          echo "Workflow is executing on Github-hosted Windows runner."
          echo "Runner Name: $RUNNER_NAME"
          echo "Runner OS: $RUNNER_OS"
          echo "Runner Architecture: $RUNNER_ARCH"